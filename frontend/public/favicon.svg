<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logo-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Calendar Body -->
  <rect x="10" y="13" width="28" height="24" rx="5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Calendar Top Hooks -->
  <line x1="17" y1="9" x2="17" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="31" y1="9" x2="31" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Calendar Divider -->
  <line x1="10" y1="20" x2="38" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Active Clock Shift Overlay -->
  <circle cx="28" cy="27" r="6.5" fill="#4338ca" stroke="#ffffff" stroke-width="2"/>
  <path d="M28 24.5V27.5L30 28.5" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Schedule Dots -->
  <circle cx="16" cy="25" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="16" cy="30" r="1.5" fill="#ffffff" opacity="0.9"/>
</svg>
